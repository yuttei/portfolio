<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" fill="none">
  <!-- 背景は白 (#FFFFFF) に統一 -->
  <rect width="760" height="720" fill="#FFFFFF"/>

  <!-- 外枠（ブラウザ画面） -->
  <rect x="40" y="20" width="680" height="680" rx="10" fill="#FFFFFF" stroke="#263947" stroke-width="2"/>

  <!-- 1. ヘッダー（上部固定） -->
  <line x1="41" y1="64" x2="719" y2="64" stroke="#DDDDDD" stroke-width="1.5"/>
  <text x="72" y="47" font-family="sans-serif" font-size="14" font-weight="700" fill="#222222">Yuttei</text>
  <text x="512" y="47" font-family="sans-serif" font-size="12" fill="#222222">Profile</text>
  <text x="568" y="47" font-family="sans-serif" font-size="12" fill="#222222">Web Apps</text>
  <text x="640" y="47" font-family="sans-serif" font-size="12" fill="#222222">Web Sites</text>

  <!-- 2. プロフィールセクション（カード枠なし・細い区切り線で下と分離） -->
  <circle cx="104" cy="116" r="28" fill="#3D6480" fill-opacity="0.14" stroke="#263947" stroke-width="1.5"/>
  <text x="104" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#263947">アイコン</text>
  <text x="148" y="111" font-family="sans-serif" font-size="18" font-weight="700" fill="#222222">ゆってい</text>
  <text x="148" y="131" font-family="sans-serif" font-size="12" fill="#222222">西尾 優伽  にしお ゆうが</text>
  <text x="76" y="166" font-family="sans-serif" font-size="12" fill="#222222">自己紹介文</text>

  <line x1="76" y1="180" x2="684" y2="180" stroke="#DDDDDD" stroke-width="1"/>
  <text x="76" y="198" font-family="sans-serif" font-size="11" fill="#222222">所属</text>
  <text x="380" y="198" font-family="sans-serif" font-size="11" fill="#222222">研究室</text>

  <!-- SNSボタン群 -->
  <rect x="76" y="212" width="74" height="26" rx="13" fill="#FFFFFF" stroke="#263947" stroke-width="1"/>
  <text x="113" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">GitHub</text>
  <rect x="160" y="212" width="56" height="26" rx="13" fill="#FFFFFF" stroke="#263947" stroke-width="1"/>
  <text x="188" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">X</text>
  <rect x="226" y="212" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#263947" stroke-width="1"/>
  <text x="266" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">YouTube</text>
  <rect x="316" y="212" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#263947" stroke-width="1"/>
  <text x="348" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">note</text>
  <rect x="390" y="212" width="70" height="26" rx="13" fill="#FFFFFF" stroke="#263947" stroke-width="1"/>
  <text x="425" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#222222">Email</text>

  <!-- プロフィール下部の区切り線 -->
  <line x1="76" y1="256" x2="684" y2="256" stroke="#DDDDDD" stroke-width="1.5"/>

  <!-- 3. Web Apps セクション（横スクロール） -->
  <text x="76" y="286" font-family="sans-serif" font-size="15" font-weight="700" fill="#222222">Web Apps</text>
  <text x="684" y="286" text-anchor="end" font-family="sans-serif" font-size="11" fill="#3D6480">※横スクロール対応（カード幅 340px）</text>

  <!-- Web Apps カード1 -->
  <rect x="76" y="298" width="236" height="154" rx="8" fill="#FFFFFF" stroke="#263947" stroke-width="1.5"/>
  <rect x="77" y="299" width="234" height="88" rx="7" fill="#3D6480" fill-opacity="0.1"/>
  <text x="194" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#263947">実画面サムネイル（16:9）</text>
  <text x="90" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#222222">POLARIS</text>
  <text x="298" y="410" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3D6480">↗</text>
  <text x="90" y="432" font-family="sans-serif" font-size="11" fill="#222222">概要説明（最大3行）</text>

  <!-- Web Apps カード2 -->
  <rect x="328" y="298" width="236" height="154" rx="8" fill="#FFFFFF" stroke="#263947" stroke-width="1.5"/>
  <rect x="329" y="299" width="234" height="88" rx="7" fill="#3D6480" fill-opacity="0.1"/>
  <text x="446" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#263947">実画面サムネイル（16:9）</text>
  <text x="342" y="410" font-family="sans-serif" font-size="12" font-weight="700" fill="#222222">青春再演劇場 リプライズ</text>
  <text x="550" y="410" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3D6480">↗</text>
  <text x="342" y="432" font-family="sans-serif" font-size="11" fill="#222222">概要説明（最大3行）</text>

  <!-- 横スクロールの続き（見切れカード表現） -->
  <rect x="580" y="298" width="104" height="154" rx="8" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="632" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9A9A9A">追加カード →</text>

  <!-- 4. Web Sites セクション（横スクロール） -->
  <text x="76" y="486" font-family="sans-serif" font-size="15" font-weight="700" fill="#222222">Web Sites</text>
  <text x="684" y="486" text-anchor="end" font-family="sans-serif" font-size="11" fill="#3D6480">※横スクロール対応（カード幅 340px）</text>

  <!-- Web Sites カード1 -->
  <rect x="76" y="498" width="236" height="148" rx="8" fill="#FFFFFF" stroke="#263947" stroke-width="1.5"/>
  <rect x="77" y="499" width="234" height="84" rx="7" fill="#3D6480" fill-opacity="0.1"/>
  <text x="194" y="545" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#263947">実画面サムネイル（16:9）</text>
  <text x="90" y="606" font-family="sans-serif" font-size="12" font-weight="700" fill="#222222">にしおピアノ教室 Web サイト</text>
  <text x="298" y="606" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3D6480">↗</text>
  <text x="90" y="628" font-family="sans-serif" font-size="11" fill="#222222">概要説明（最大3行）</text>

  <!-- 横スクロールの続き -->
  <rect x="328" y="498" width="120" height="148" rx="8" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="388" y="576" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9A9A9A">追加カード →</text>

  <!-- 5. フッター -->
  <line x1="40" y1="664" x2="720" y2="664" stroke="#DDDDDD" stroke-width="1.5"/>
  <text x="76" y="687" font-family="sans-serif" font-size="11" fill="#222222">© 2026 Yuttei (Yuga Nishio)</text>
  <text x="684" y="687" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222222">Built with React &amp; TypeScript</text>
</svg>
